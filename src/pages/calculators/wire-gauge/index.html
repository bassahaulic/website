    <section class="section">
      <div class="container container--narrow">
        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <a href="/">Home</a>
          <span class="breadcrumbs__separator" aria-hidden="true">/</span>
          <a href="/calculators/">Calculators</a>
          <span class="breadcrumbs__separator" aria-hidden="true">/</span>
          <span aria-current="page">Wire Gauge</span>
        </nav>

        <h1>Wire Gauge Calculator</h1>
        <p class="page-intro">
          Determine the correct wire gauge for your amplifier power wire run based on current draw and distance.
        </p>

        <div class="tool-panel tool-panel--spaced">
          <div class="tool-panel__header">
            <h2 class="tool-panel__title">Calculate Wire Gauge</h2>
          </div>

          <form id="wire-gauge-form" onsubmit="return false;">
            <div class="grid grid--2col">
              <div class="form-group">
                <label for="amperage" class="form-label">Max Current Draw (Amps)</label>
                <input type="number" id="amperage" class="form-input" placeholder="e.g. 150" min="1" step="1" required>
                <p class="form-hint">Total fuse rating of your amplifier(s)</p>
              </div>

              <div class="form-group">
                <label for="wire-length" class="form-label">Wire Run Length (feet)</label>
                <input type="number" id="wire-length" class="form-input" placeholder="e.g. 16" min="1" step="0.5" required>
                <p class="form-hint">One-way distance from battery to amp</p>
              </div>
            </div>

            <div class="form-group">
              <label for="voltage-drop" class="form-label">Max Voltage Drop (%)</label>
              <select id="voltage-drop" class="form-select">
                <option value="2">2% (Recommended)</option>
                <option value="3">3% (Acceptable)</option>
                <option value="5">5% (Maximum)</option>
              </select>
            </div>

            <button type="submit" class="btn btn--secondary btn--block">Calculate</button>
          </form>

          <div id="wire-result" class="tool-panel__result" hidden>
            <div class="tool-panel__result-label">Recommended Wire Gauge</div>
            <div class="tool-panel__result-value" id="result-gauge">--</div>
            <p id="result-detail" class="tool-panel__result-detail"></p>
          </div>
        </div>
      </div>
    </section>
